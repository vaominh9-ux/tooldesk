function handleAction(target){
  const {action,id,route,value,filter,segment,customer,product}=target.dataset;
  switch(action){
    case 'skip-content':document.getElementById('main').focus();break;
    case 'go':navigate(route);break;
    case 'customer':navigate('customers',id);break;
    case 'toggle-mobile':setMobileMenu(!state.mobileOpen);break;
    case 'close-mobile':setMobileMenu(false);break;
    case 'new-order':showDialog(createOrderDialog(data,{customerId:customer,productId:product}));break;
    case 'refund':showDialog(refundDialog(data,id));break;
    case 'recover-cost':showDialog(refundDialog(data,id,true));break;
    case 'refund-back':if(closeDialog())showDialog(orderDetailDialog(data,id));break;
    case 'refund-full':{
      const form=document.getElementById('refund-form');
      const order=data.orders.find(o=>o.id===form.elements.orderId.value);
      form.elements.amount.value=orderFinancials(order,data.refunds).remainingRefund;
      form.dataset.dirty='true';updateRefundSummary(form);break;
    }
    case 'order-detail':showDialog(orderDetailDialog(data,id));break;
    case 'sub-detail':showDialog(subscriptionDetailDialog(data,id));break;
    case 'renew':showDialog(renewDialog(data,id));break;
    case 'new-customer':showDialog(customerFormDialog(data));break;
    case 'edit-customer':showDialog(customerFormDialog(data,id));break;
    case 'new-product':showDialog(productFormDialog());break;
    case 'edit-plan':showDialog(planFormDialog(data,id));break;
    case 'search':showDialog(searchDialog(data));break;
    case 'close-dialog':closeDialog();break;
    case 'help':showDialog(helpDialog());break;
    case 'activity':showDialog(activityDialog(data));break;
    case 'notifications':
      state.dashboardTab='renewal';navigate('dashboard');
      toast('Việc cần xử lý nằm ngay ở Tổng quan','Số lượng được tính từ dữ liệu mẫu, chưa phải thông báo tự động.');
      break;
    case 'tab':
      if(filter==='dashboardTab')state.dashboardTab=value;
      else{currentFilter()[filter||'tab']=value;currentFilter().page=1;}
      render();break;
    case 'page':currentFilter().page=Number(target.dataset.page);render();break;
    case 'clear-search':currentFilter().search='';currentFilter().page=1;render();break;
    case 'clear-filters':Object.assign(currentFilter(),{search:'',product:'',kind:'',contact:'',consent:'',page:1});render();break;
    case 'chart-days':state.chartDays=Number(target.dataset.days);render();break;
    case 'open-renewals':state.filters.subscriptions.tab='expiring';state.filters.subscriptions.page=1;navigate('subscriptions');break;
    case 'view-tasks':
      if(state.dashboardTab==='unpaid'){state.filters.orders.tab='unpaid';navigate('orders');}
      else{state.filters.subscriptions.tab=state.dashboardTab==='expired'?'expired':'expiring';navigate('subscriptions');}
      break;
    case 'toggle-new-customer':{
      const form=document.getElementById('order-form'),isNew=form.elements.isNewCustomer.value!=='1';
      form.elements.isNewCustomer.value=isNew?'1':'0';
      document.getElementById('existing-customer-block').hidden=isNew;
      document.getElementById('new-customer-block').hidden=!isNew;
      form.elements.customerLookup.disabled=isNew;
      for(const name of ['newCustomerName','newCustomerEmail','newCustomerPhone'])form.elements[name].disabled=!isNew;
      form.elements.newCustomerName.required=isNew;
      target.innerHTML=isNew?`${icon('left',12)}Chọn khách đã có`:`${icon('plus',12)}Thêm khách mới`;
      (isNew?form.elements.newCustomerName:form.elements.customerLookup).focus();
      break;
    }
    case 'remind':{
      const s=data.subscriptions.find(s=>s.id===id);
      if(!s||s.remindedAt)return;
      closeDialog(true);
      commit(d=>{
        d.subscriptions.find(s=>s.id===id).remindedAt=DEMO_TODAY;
        logActivity(d,'reminder','Đã ghi nhận liên hệ',`${findCustomer(d,s.customerId).name} · ${findProduct(d,s.productId).name}`);
      },'Đã ghi nhận khách đã được nhắc','Đây là ghi chú liên hệ thủ công; hệ thống không gửi tin nhắn.');
      break;
    }
    case 'pay-confirm':showDialog(paymentConfirmDialog(data,id));break;
    case 'pay':{
      const o=data.orders.find(o=>o.id===id);
      if(!o||o.payment==='paid')return;
      closeDialog(true);
      commit(d=>{
        Object.assign(d.orders.find(o=>o.id===id),{payment:'paid',paidAt:DEMO_TODAY,paidAtEstimated:false});
        logActivity(d,'payment','Đã ghi nhận thanh toán',`${id} · ${money(o.price)}`);
      },'Đã ghi nhận thanh toán',`${id} · ${money(o.price)}`);
      break;
    }
    case 'new-campaign':startCampaign({segment});break;
    case 'edit-campaign':startCampaign({id});break;
    case 'campaign-next':{
      const form=document.getElementById('campaign-form');
      if(!form.reportValidity())return;
      captureCampaignForm();
      if(campaignStep===2&&(!campaignDraft.name.trim()||!campaignDraft.subject.trim()||!campaignDraft.body.trim()))throw new Error('Điền đầy đủ nội dung trước khi kiểm tra.');
      campaignStep=Math.min(3,campaignStep+1);
      showDialog(campaignDialog(data,campaignDraft,campaignStep));
      document.getElementById('campaign-form').dataset.dirty='true';
      break;
    }
    case 'campaign-prev':captureCampaignForm();campaignStep=Math.max(1,campaignStep-1);showDialog(campaignDialog(data,campaignDraft,campaignStep));document.getElementById('campaign-form').dataset.dirty='true';break;
    case 'reset-confirm':showDialog(resetDialog());break;
    case 'reset-data':
      closeDialog(true);data=seedData();persistData(data);
      state.filters=Object.fromEntries(Object.keys(routeLabels).map(r=>[r,{search:'',tab:'all',product:'',kind:'',contact:'',consent:'',page:1}]));
      render();toast('Đã khôi phục dữ liệu mẫu','Các thay đổi cũ trong bản trải nghiệm đã được thay thế.');break;
    case 'export-data':exportData();break;
    case 'sync-supabase':{
      if(typeof window.fetchTooldeskDataFromSupabase!=='function'){toast('Chưa nạp script','Không tìm thấy script đồng bộ Supabase.');break;}
      toast('Đang kết nối...','Đang tải dữ liệu từ Supabase Cloud.');
      window.fetchTooldeskDataFromSupabase().then(cloudData=>{
        if(cloudData&&cloudData.customers&&cloudData.customers.length){
          data=cloudData;persistData(data);render();
          toast('Đồng bộ thành công!','Đã nạp '+data.customers.length+' khách hàng & '+data.orders.length+' đơn hàng từ Supabase.');
        }else{
          toast('Chưa có dữ liệu','Không tải được dữ liệu hợp lệ từ Supabase.');
        }
      }).catch(err=>{
        toast('Lỗi đồng bộ',err.message||'Không thể kết nối đến Supabase.');
      });
      break;
    }
  }
}
document.addEventListener('click',event=>{
  const target=event.target.closest('[data-action]');
  if(!target||target.disabled)return;
  event.preventDefault();
  try{handleAction(target);}catch(error){errorMessage(error.message||'Thao tác chưa hoàn tất.');}
});
document.addEventListener('submit',event=>{
  const form=event.target;
  if(!['order-form','renew-form','customer-form','product-form','plan-form','campaign-form','settings-form','refund-form'].includes(form.getAttribute('id')))return;
  event.preventDefault();
  if(submitting)return;
  submitting=true;
  const submit=form.querySelector('[type="submit"]');
  if(submit)submit.disabled=true;
  try{
    const handlers={'order-form':saveOrder,'renew-form':saveRenewal,'customer-form':saveCustomer,'product-form':saveProduct,'plan-form':savePlan,'campaign-form':saveCampaign,'settings-form':saveSettings,'refund-form':saveRefund};
    handlers[form.getAttribute('id')](form);
  }catch(error){errorMessage(error.message||'Vui lòng kiểm tra thông tin đã nhập.');}
  finally{submitting=false;if(submit?.isConnected)submit.disabled=false;}
});
document.addEventListener('input',event=>{
  const input=event.target;
  if(input.id==='global-query'){document.getElementById('command-results').innerHTML=commandResults(data,input.value);return;}
  if(input.dataset.filter){currentFilter()[input.dataset.filter]=input.value;currentFilter().page=1;render(true);return;}
  const form=input.closest('form');
  if(!form)return;
  form.dataset.dirty='true';
  if(form.getAttribute('id')==='refund-form')updateRefundSummary(form);
  if(form.getAttribute('id')==='order-form'&&['price','cost','startsAt'].includes(input.name))updateOrderSummary(form);
  if(form.getAttribute('id')==='renew-form'&&input.name==='price')updateRenewSummary(form);
  if(form.getAttribute('id')==='campaign-form'&&campaignStep===2){
    captureCampaignForm();
    document.getElementById('campaign-email-preview').innerHTML=emailPreview(data,campaignDraft);
  }
});
document.addEventListener('change',event=>{
  const input=event.target;
  if(input.hasAttribute('data-report-month')){state.reportMonth=input.value;render();return;}
  if(input.dataset.filter){currentFilter()[input.dataset.filter]=input.value;currentFilter().page=1;render();return;}
  const form=input.closest('form');
  if(!form)return;
  form.dataset.dirty='true';
  if(form.getAttribute('id')==='refund-form')updateRefundSummary(form);
  if(form.getAttribute('id')==='order-form'){
    if(input.name==='productId')updateOrderSummary(form,'product');
    else if(input.name==='planId')updateOrderSummary(form,true);
    else updateOrderSummary(form);
  }
  if(form.getAttribute('id')==='renew-form')updateRenewSummary(form,input.name==='planId');
  if(form.getAttribute('id')==='campaign-form'&&input.name==='segment'){
    captureCampaignForm();document.getElementById('campaign-audience').innerHTML=campaignAudience(data,campaignDraft.segment);
  }
});
document.addEventListener('keydown',event=>{
  if(state.mobileOpen&&window.matchMedia('(max-width:1023px)').matches&&!document.getElementById('active-dialog')){
    if(event.key==='Escape'){event.preventDefault();setMobileMenu(false);return;}
    if(event.key==='Tab'){
      const nodes=Array.from(document.querySelectorAll('.sidebar a,.sidebar button')).filter(el=>el.getClientRects().length);
      const first=nodes[0],last=nodes.at(-1);
      if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
      else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
    }
  }

  if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){
    event.preventDefault();
    if(document.getElementById('global-query'))closeDialog();
    else if(!document.getElementById('active-dialog'))showDialog(searchDialog(data));
    return;
  }
  const query=document.getElementById('global-query');
  if(query){
    const results=Array.from(document.querySelectorAll('.command-result'));
    if(event.key==='ArrowDown'||event.key==='ArrowUp'){
      event.preventDefault();const index=results.indexOf(document.activeElement);
      const next=event.key==='ArrowDown'?Math.min(index+1,results.length-1):Math.max(index-1,0);
      results[next]?.focus();return;
    }
    if(event.key==='Enter'&&document.activeElement===query&&results.length){event.preventDefault();results[0].click();}
  }
});
window.addEventListener('hashchange',()=>{readRoute();render();window.scrollTo(0,0);});
window.addEventListener('storage',event=>{
  if(event.key!==STORAGE_KEY)return;
  data=loadData();render();toast('Dữ liệu vừa được cập nhật ở tab khác','Bản mẫu chưa có cơ chế đồng bộ đa người dùng.');
});
window.matchMedia('(max-width:1023px)').addEventListener('change',()=>{state.mobileOpen=false;render();});
readRoute();persistData(data);render();

})();
</script>
</body>
</html>
