<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="description" content="Tooldesk — giao diện quản lý đơn hàng, khách hàng và gia hạn tool AI.">
  <title>Tooldesk — Quản lý kinh doanh tool AI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23253152'/%3E%3Cpath d='M16 6v20M6 16h20M9 9l14 14M23 9L9 23' stroke='%23afbcff' stroke-width='3'/%3E%3C/svg%3E">
  <style>
@charset "UTF-8";
:root{--bg:#f6f7fb;--surface:#fff;--ink:#202a43;--muted:#778197;--line:#e8ebf2;--accent:#5963e8;--accent-dark:#4651d6;--accent-soft:#eff0ff;--green:#15775c;--amber:#9d6817;--red:#b14949;--radius:14px;--shadow:0 3px 15px rgba(29,39,71,.035);--sidebar:224px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:14px;color:var(--ink);font-synthesis:none}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:inherit;text-decoration:none}
button{color:inherit}
input,select,textarea{min-width:0}
button:focus-visible,a:focus-visible{outline:3px solid #afb5ff;outline-offset:3px}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--accent)!important;box-shadow:0 0 0 3px #5963e815}

h1,h2,h3,p{margin:0}
h1{font-size:29px;line-height:1.25;font-weight:680;letter-spacing:-1px}
h2{font-size:16px;font-weight:650;letter-spacing:-.3px}
h3{font-size:15px;font-weight:650}
small{font-size:12px;color:var(--muted)}
.strong,strong{font-weight:600}
.positive{color:var(--green)}
.negative{color:var(--red)}
.muted{color:var(--muted)}
.icon{flex:none;vertical-align:middle}
.nowrap{white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}
.divider{height:1px;background:var(--line);margin:18px 0}
.skip-link{position:fixed;top:-80px;left:16px;padding:12px;background:white;z-index:9999}
.skip-link:focus{top:10px}

.sidebar{width:var(--sidebar);height:100dvh;position:fixed;left:0;top:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;padding:29px 16px 18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 12px;font-size:25px;font-weight:750;letter-spacing:-1.1px}
.brand-mark{width:34px;height:34px;display:grid;place-items:center;background:#263250;color:#c0c7ff;border-radius:10px;box-shadow:0 3px 6px #17275217}
.brand-mark svg{width:24px;height:24px}
.nav-label{padding:0 14px;margin-bottom:10px;font-size:12px;letter-spacing:1.4px;color:#9099a9;font-weight:650}
.nav-group{display:grid;gap:5px;margin-bottom:26px}
.nav-item{width:100%;border:1px solid transparent;border-radius:9px;background:transparent;padding:11px 12px;display:flex;align-items:center;gap:11px;color:#69738a;text-align:left;font-size:12.5px;font-weight:500;transition:background .15s,color .15s}
.nav-item .icon{width:18px;height:18px;opacity:.9}
.nav-item:hover{background:#f7f8fc;color:var(--ink)}
.nav-item.active{background:var(--accent-soft);color:#505ad1;font-weight:650;border-color:#e7e9fe}
.nav-count{margin-left:auto;background:#e0e3ff;font-size:12px;padding:2px 6px;border-radius:5px;color:#525ccc;min-width:21px;text-align:center}
.nav-new{margin-left:auto;border:1px solid #e5e7f0;color:#9ba1ae;padding:2px 5px;border-radius:4px;font-size:12px;letter-spacing:.5px}
.sidebar-bottom{margin-top:auto}
.demo-card{border:1px solid #e8eaf6;background:linear-gradient(130deg,#fafaff,#f3f5fc);border-radius:10px;padding:13px 12px;margin:0 4px 18px}
.demo-card strong{font-size:13px;display:flex;gap:7px;align-items:center}
.demo-card p{font-size:12px;color:var(--muted);line-height:1.7;margin:7px 0 0}
.sidebar-user{display:flex;align-items:center;gap:10px;border:0;border-top:1px solid var(--line);padding:17px 11px 0;background:transparent;width:100%;text-align:left}
.sidebar-user strong{font-size:12px;display:block}
.sidebar-user small{font-size:12px;display:block;margin-top:3px}
.sidebar-user>.icon{margin-left:auto;color:#98a1b2}
.sidebar-overlay{display:none}

.shell{margin-left:var(--sidebar);min-height:100dvh}
.topbar{height:76px;padding:0 32px;background:#ffffffd9;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}
.breadcrumb{display:flex;align-items:center;gap:13px;font-size:11.5px;color:#8a93a4}
.breadcrumb>span:last-child{color:#525f78;font-weight:500}
.breadcrumb .icon{color:#a1aabc}
.topbar-actions{display:flex;gap:14px;align-items:center}
.global-search{border:1px solid var(--line);background:#fcfcfe;color:#99a1b1;display:flex;align-items:center;gap:9px;padding:8px 9px 8px 11px;border-radius:8px;min-width:234px;text-align:left;font-size:11.5px}
.global-search kbd{font-family:inherit;margin-left:auto;border:1px solid #e9ebf2;border-radius:4px;padding:2px 5px;font-size:12px;background:#fff;color:#929aac}
.icon-button{border:1px solid transparent;background:transparent;border-radius:7px;height:32px;min-width:32px;display:inline-flex;align-items:center;justify-content:center;padding:5px;color:#8a94a7}
.icon-button:hover{background:#f1f3fa;color:var(--ink)}
.notification-button{position:relative}
.notification-button::after{content:"";width:5px;height:5px;border:2px solid white;box-sizing:content-box;border-radius:50%;background:#d39469;position:absolute;top:3px;right:5px}
.topbar-divider{height:22px;width:1px;background:var(--line)}
.demo-pill{display:flex;align-items:center;gap:5px;font-size:12px;color:#8b90a5;text-transform:uppercase;letter-spacing:.8px}
.demo-pill i{width:5px;height:5px;background:#9c96c2;border-radius:50%}
.mobile-toggle{display:none}

main{padding:30px 32px 20px;max-width:1680px;margin:auto;min-height:calc(100dvh - 76px)}
.page-heading{display:flex;align-items:center;justify-content:space-between;margin:0 0 26px;gap:16px}
.page-heading p{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.page-actions{display:flex;gap:10px;align-items:center;flex-shrink:0}
.button{display:inline-flex;gap:8px;align-items:center;justify-content:center;min-height:37px;padding:9px 14px;border-radius:8px;border:1px solid #e2e6ee;background:white;font-size:11.5px;font-weight:550;white-space:nowrap;transition:background .15s,box-shadow .15s,transform .15s}
.button:hover{background:#f6f7fd;box-shadow:0 2px 5px #15204208}
.button:active:not(:disabled){transform:translateY(1px)}
.button .icon{width:16px;height:16px}
.button.primary{border-color:var(--accent);background:var(--accent);color:white;box-shadow:0 3px 6px #5963e822}
.button.primary:hover{background:var(--accent-dark)}
.button.soft{background:var(--accent-soft);border-color:#e8eafe;color:#5460d7}
.button.small{font-size:12px;min-height:29px;padding:5px 9px;border-radius:6px;gap:5px}
.button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.button.danger{color:var(--red);background:#fff8f8;border-color:#f1dada}
.button.full{width:100%}
.text-link{background:none;border:none;padding:0;color:inherit;text-align:left;font-size:inherit}
.text-link:hover{color:var(--accent)}
.text-button{background:transparent;border:0;color:var(--accent);font-size:13px;display:inline-flex;align-items:center;gap:6px;padding:4px 0;font-weight:550}
.text-button:hover{text-decoration:underline}

.metrics-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px;margin-bottom:24px}
.metric-card{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:19px 20px 16px;box-shadow:var(--shadow);min-width:0}
.metric-top{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;color:#748099}
.metric-icon{display:grid;place-items:center;width:30px;height:30px;border:1px solid #edf0f7;border-radius:8px;color:#8a93a9;background:#fcfcfe}
.metric-card.accent .metric-icon{color:#656dd3;background:#f3f3ff;border-color:#ebecff}
.metric-value{font-size:28px;letter-spacing:-1.2px;font-weight:650;margin:12px 0 13px;line-height:1.15;font-variant-numeric:tabular-nums}
.metric-value .unit{font-size:20px;letter-spacing:0;font-weight:500;color:#a0a8b7;margin-left:2px}
.metric-foot{font-size:12px;color:#9199a9;display:flex;align-items:center;gap:6px;line-height:1.6;flex-wrap:wrap}
.mini-trend{font-size:12px;color:var(--green);background:#eff8f3;border-radius:4px;padding:2px 5px}
.metric-foot .dot{width:5px;height:5px;border-radius:50%;background:#e2af62}

.dashboard-work{display:grid;grid-template-columns:minmax(0,1fr) 295px;gap:23px;margin-bottom:24px}
.panel{border:1px solid var(--line);background:white;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 23px 18px}
.section-heading h2{display:flex;gap:8px;align-items:center}
.section-heading p{font-size:13px;line-height:1.6;color:var(--muted);margin-top:5px}
.count-bubble{font-size:12px;letter-spacing:0;background:#f1f2f8;color:#7e88a1;padding:3px 6px;border-radius:5px;font-weight:500}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);padding:0 23px;overflow:auto;scrollbar-width:none}
.tab{font-size:11.5px;color:#8590a4;font-weight:500;padding:11px 0 14px;background:none;border:0;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab span{font-size:12px;padding:2px 5px;background:#f0f2f7;color:#7d8698;border-radius:4px}
.tab.selected{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab.selected span{background:var(--accent-soft);color:#626cd6}
.table-scroll{overflow:auto;scrollbar-width:thin}
table{width:100%;border-collapse:collapse;text-align:left;font-size:11.5px}
th{color:#929bab;font-weight:500;background:#fcfcfe;font-size:12px;padding:12px 20px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:16px 20px;border-bottom:1px solid #f0f2f7;color:#62708a;vertical-align:middle;line-height:1.4}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fcfcff}
td .strong{color:#34425c}
th:first-child,td:first-child{padding-left:23px}
th:last-child,td:last-child{padding-right:23px}
.person-cell{display:flex;align-items:center;gap:10px;min-width:150px}
.person-cell>div{min-width:0}
.person-cell small{display:block;font-size:12px;margin-top:4px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#99a1b1}
.avatar{display:inline-flex;align-items:center;justify-content:center;height:32px;min-width:32px;width:32px;flex-shrink:0;border-radius:50%;font-size:12px;font-weight:600;letter-spacing:-.4px}
.avatar.large{height:62px;width:62px;font-size:19px}
.avatar.small{height:29px;width:29px;min-width:29px;font-size:12px}
.lavender{background:#efedfa;color:#8a79a4}
.rose{background:#faeceb;color:#b78782}
.sky{background:#e8f0fb;color:#688cbb}
.mint{background:#e8f5ee;color:#4c9373}
.sand{background:#f6f0e4;color:#aa9567}
.product-cell{display:flex;align-items:center;gap:9px;min-width:108px}
.product-cell small{display:block;font-size:12px;margin-top:3px;color:#98a1b2}
.product-logo{display:inline-grid;place-items:center;width:28px;height:28px;min-width:28px;border-radius:8px;font-size:19px;font-family:Arial,sans-serif}
.product-logo.large{width:45px;height:45px;font-size:28px;border-radius:12px}
.product-logo.peach{background:#faece5;color:#c19074}
.product-logo.blue{background:#edf1ff;color:#7b86d7}
.product-logo.aqua{background:#e5f4f2;color:#65a39e}
.product-logo.purple{background:#f0ebfc;color:#9583cd;font-style:italic;font-family:Georgia,serif;font-size:21px}
.badge{font-size:12px;line-height:1.35;padding:4px 7px;border-radius:5px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-weight:500}
.badge i{width:4px;height:4px;border-radius:50%;background:currentColor;flex:none}
.badge.neutral{color:#7d8698;background:#f2f3f7}
.badge.green{color:#38856b;background:#edf7f1}
.badge.amber{color:#ac853f;background:#fcf5e8}
.badge.red{color:#b87774;background:#fcf0ee}
.badge.blue{color:#6b72c4;background:#f0f1fe}
.remaining{font-size:12px;white-space:nowrap;color:#8390a5}
.remaining.warning{color:#b88c48}
.remaining.danger{color:#bb7873}
.remaining small{display:block;font-size:12px;color:#a0a8b7;margin-top:4px}
.row-actions{display:flex;gap:7px;align-items:center;justify-content:flex-end}
.renew-button{color:#616bd1;background:#fff;border-color:#e1e4f7}
.work-table td{padding-top:15px;padding-bottom:15px}
.work-table .person-cell{min-width:148px}
.work-table .person-cell small{max-width:145px}
.work-table td:nth-child(2){padding-left:8px;padding-right:8px}
.work-footer{font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:12px 23px;color:#a1a9b8}
.work-footer>span{display:flex;align-items:center;gap:6px}

.right-rail{display:flex;flex-direction:column;gap:16px}
.opportunity{position:relative;overflow:hidden;background:#273452;border:1px solid #273452;border-radius:var(--radius);padding:23px;color:white;flex:1;min-height:235px}
.opportunity::after{content:"";position:absolute;right:-108px;top:-25px;width:225px;height:225px;border:1px solid #ffffff0c;box-shadow:0 0 0 23px #ffffff04,0 0 0 47px #ffffff03,0 0 0 73px #ffffff02;border-radius:50%;pointer-events:none}
.opportunity>*{position:relative;z-index:1}
.eyebrow{font-size:12px;letter-spacing:1.2px;font-weight:600;display:flex;align-items:center;gap:7px}
.opportunity .eyebrow{color:#b1bfdc}
.opportunity-value{font-size:30px;font-weight:600;letter-spacing:-1.1px;margin-top:24px}
.opportunity>p{font-size:12px;color:#a7b6d1;margin-top:7px;line-height:1.5}
.opportunity-meter{height:4px;background:#ffffff1a;border-radius:3px;margin:21px 0 11px;overflow:hidden}
.opportunity-meter>span{display:block;background:#b7c0ff;height:100%;border-radius:3px;min-width:0}
.opportunity-caption{display:flex;justify-content:space-between;color:#b5c1d8;font-size:12px}
.opportunity .text-button{color:#dce3ff;margin-top:20px;font-size:12px}
.care-card{padding:20px;border:1px solid var(--line);background:linear-gradient(125deg,#fbfbff,#f0f2fc);border-radius:var(--radius)}
.care-top{display:flex;align-items:center;gap:10px}
.care-symbol{width:33px;height:33px;background:#fff;border:1px solid #e8eaf9;display:grid;place-items:center;border-radius:9px;color:#8a8eca}
.care-card h3{font-size:12px}
.care-card p{color:#8b94a9;font-size:12px;line-height:1.8;margin:10px 0 14px}
.care-card .text-button{font-size:12px}

.dashboard-bottom{display:grid;grid-template-columns:minmax(0,1fr) 295px;gap:23px}
.chart-header{display:flex;align-items:center;justify-content:space-between}
.segmented{display:inline-flex;background:#f4f5f9;padding:3px;border-radius:7px}
.segmented button{font-size:12px;background:transparent;color:#929baa;border:0;padding:5px 8px;border-radius:5px}
.segmented button.active{background:#fff;color:#606b84;box-shadow:0 1px 3px #18274412}
.chart-summary{padding:0 24px;display:flex;gap:12px;align-items:center}
.chart-summary>strong{font-size:22px;font-weight:600;letter-spacing:-.8px}
.chart-summary>small{font-size:12px}
.chart-wrap{padding:4px 15px 0 8px}
.chart-wrap svg{width:100%;height:183px;display:block}
.chart-wrap text{font-family:inherit;font-size:12px;fill:#a8afbd}
.chart-legend{display:flex;align-items:center;justify-content:space-between;padding:5px 24px 19px;color:#a0a8b7;font-size:12px}
.chart-legend>span{display:flex;align-items:center;gap:6px}
.legend-dot{width:5px;height:5px;background:#8b94e6;border-radius:50%}
.activity-list{padding:0 21px 8px}
.activity-row{display:flex;gap:12px;position:relative;padding:0 0 20px}
.activity-row:not(:last-child)::before{content:"";position:absolute;top:29px;left:13px;bottom:3px;border-left:1px solid #f0f2f7}
.activity-symbol{display:grid;place-items:center;height:28px;width:28px;min-width:28px;border-radius:8px;background:#f5f6fa;color:#a1aabc}
.activity-symbol.highlight{background:#eef7f1;color:#83aa94}
.activity-row strong{font-size:12px;display:block;margin:2px 0 5px}
.activity-row p{font-size:12px;color:#97a0b1;line-height:1.5}
.activity-row small{font-size:12px;color:#b0b7c5;display:block;margin-top:5px}
.app-footer{display:flex;align-items:center;justify-content:space-between;padding:23px 0 3px;font-size:12px;color:#acb3c1}
.app-footer>span{display:flex;align-items:center;gap:6px}
.app-footer i{height:4px;width:4px;border-radius:50%;background:#a7b7ab}

.list-toolbar{padding:19px 23px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search-field{display:flex;align-items:center;gap:8px;border:1px solid #e5e8f0;background:#fff;padding:0 11px;min-height:36px;border-radius:7px;width:280px;color:#a1a9b9;position:relative}
.search-field input{border:none;background:transparent;outline:none;width:100%;font-size:13px;color:var(--ink);padding:9px 0}
.search-field input:focus{box-shadow:none}
.search-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px #5963e80a}
.search-clear{border:0;background:none;font-size:18px;color:var(--muted);padding:0}
.select-filter{height:36px;border:1px solid #e5e8f0;border-radius:7px;background:white;color:#7f899f;font-size:12px;padding:0 28px 0 10px;max-width:220px}
.toolbar-end{margin-left:auto;font-size:12px;color:#98a2b5}
.table-footer{padding:16px 23px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);font-size:12px;color:#98a1b2;gap:10px}
.table-footer strong{font-weight:500;color:#75819a}
.pagination{display:flex;align-items:center;gap:12px;font-size:12px}
.pagination .icon-button{border-color:var(--line);height:28px;min-width:28px}
.data-table td{height:72px}
.data-table .money{color:#53617c;font-variant-numeric:tabular-nums;font-weight:550;white-space:nowrap}
.order-number{color:#616acb;font-size:13px;font-weight:550}
.order-kind{display:block;margin-top:4px;font-size:12px;color:#a0a7b6}
.sub-label{font-size:12px;color:#a1a9b7;display:flex;align-items:center;gap:3px;margin-top:5px}
.inline-metrics{display:flex;gap:32px;margin:2px 0 25px;padding:18px 22px;background:white;border:1px solid var(--line);border-radius:var(--radius)}
.inline-metric{display:flex;gap:9px;align-items:center}
.inline-metric>span{font-size:12px;color:#929bad}
.inline-metric strong{font-size:16px}
.inline-metric+.inline-metric{border-left:1px solid var(--line);padding-left:32px}
.empty-state{text-align:center;max-width:430px;margin:0 auto;padding:55px 20px}
.empty-icon{margin:0 auto 18px;height:56px;width:56px;display:grid;place-items:center;border:1px solid #e6e8f4;background:#f7f8ff;border-radius:15px;color:#9b9fcb}
.empty-state h3{font-size:15px;font-weight:550}
.empty-state p{font-size:12px;color:var(--muted);line-height:1.8;margin-top:9px}
.empty-state .button{margin-top:18px}

.customer-head{display:flex;align-items:center;gap:18px;padding:26px}
.customer-head h1{font-size:25px}
.customer-head p{font-size:13px;color:var(--muted);margin-top:7px}
.customer-head .page-actions{margin-left:auto}
.customer-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;margin-top:24px}
.customer-content{display:grid;gap:24px;align-content:start}
.customer-packages{padding:0 24px 24px;display:grid;gap:12px}
.customer-package{padding:15px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;gap:16px}
.customer-package>div:nth-child(2){flex:1}
.customer-package h3{font-size:12px;margin-bottom:7px}
.customer-package p{font-size:12px;color:var(--muted);margin-top:7px}
.customer-kpis{display:flex;border-top:1px solid var(--line);padding:20px 26px;gap:60px}
.customer-kpis span{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}
.customer-kpis strong{font-size:20px}
.detail-info{padding:0 23px 24px;display:grid;gap:22px}
.detail-info small{font-size:12px;display:block;margin-bottom:7px}
.detail-info strong{font-size:11.5px;font-weight:500;overflow-wrap:anywhere;line-height:1.6}
.consent-note{font-size:12px;color:#a0a8b6;line-height:1.7;margin-top:10px}
.note-block{white-space:pre-line;font-size:12px;line-height:1.8;color:#8994a8}
.back-link{display:inline-flex;gap:5px;align-items:center;font-size:13px;color:#7c88a1;margin-bottom:20px}

.products-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.product-card{background:white;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.product-card-head{padding:23px;display:flex;gap:12px;align-items:center}
.product-card-head h2{font-size:17px}
.product-card-head p{font-size:12px;color:var(--muted);margin-top:5px}
.product-card-description{padding:0 23px 20px;font-size:13px;line-height:1.7;color:#8d96aa;min-height:39px}
.product-plans{border-top:1px solid var(--line);padding:0 23px}
.product-plan{padding:18px 0;display:flex;gap:10px;align-items:center;justify-content:space-between}
.product-plan+.product-plan{border-top:1px solid #f0f2f7}
.product-plan h3{font-size:13px;font-weight:550}
.product-plan p{font-size:12px;color:#a0a8b9;margin-top:6px}
.product-price{font-size:12px;font-weight:600;color:#5d6885;white-space:nowrap}
.product-plan .row-actions{gap:4px}
.product-card-footer{background:#fcfcfe;padding:11px 23px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);font-size:12px;color:#9ba5b6}

.hint-banner{padding:13px 15px;border-radius:9px;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.8;margin-bottom:22px;border:1px solid transparent}
.hint-banner .icon{margin-top:1px}
.hint-banner.blue{background:#eff2fe;color:#7c86b4;border-color:#e6eafd}
.hint-banner.amber{background:#fcf7ed;color:#a18653;border-color:#f1e7d2}
.hint-banner.neutral{background:#f7f8fb;border-color:var(--line);color:#8b96ac}
.campaign-hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:24px;padding:29px 32px;margin-bottom:24px;background:linear-gradient(115deg,#f0f1fd,#f8f7fd);border:1px solid #e5e7fa;border-radius:var(--radius)}
.campaign-hero h2{font-size:21px;line-height:1.5;color:#414b77;font-weight:550}
.campaign-hero p{font-size:12px;color:#8c94ac;line-height:1.8;margin-top:8px;max-width:560px}
.campaign-graphic{width:92px;height:92px;background:#fff;border:1px solid #e9e9f8;border-radius:22px;box-shadow:0 8px 20px #6a6dad09;display:grid;place-items:center;color:#9197d5;transform:rotate(-6deg);margin-right:20px}
.segment-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:25px}
.segment-card{background:white;border:1px solid var(--line);border-radius:11px;padding:18px;text-align:left;transition:border-color .15s}
.segment-card:hover{border-color:#b7bcef}
.segment-card>span{font-size:12px;color:#8b96ac}
.segment-card strong{font-size:25px;display:block;margin:13px 0 8px;font-weight:550}
.segment-card small{font-size:12px;display:flex;align-items:center;gap:5px}
.campaign-status-note{font-size:12px;color:#97a1b4;line-height:1.6;padding:0 23px 20px}
.report-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:24px}
.bar-list{padding:0 24px 25px}
.bar-row{margin-bottom:23px}
.bar-row:last-child{margin-bottom:0}
.bar-row-head{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;margin-bottom:10px}
.bar-track{height:7px;border-radius:4px;background:#f2f4f9}
.bar-track span{height:100%;display:block;background:#a0a8e9;border-radius:4px;min-width:0}
.report-note{margin-top:22px;font-size:12px;color:#98a2b5;line-height:1.8}

.settings-layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:24px;align-items:start}
.settings-form{padding:2px 24px 24px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.form-grid .span-2{grid-column:span 2}
.field{display:flex;flex-direction:column;gap:8px;font-size:13px;min-width:0}
.field>span{font-weight:550;color:#5d6982}
.field input,.field select,.field textarea{width:100%;border:1px solid #e0e5ef;border-radius:7px;min-height:39px;padding:10px 11px;background:white;color:#3f4e6a;font-size:12px;transition:box-shadow .15s,border-color .15s}
.field input[readonly]{background:#f8f9fc;color:#8a95aa}
.field textarea{line-height:1.7;resize:vertical;min-height:94px}
.field small{font-size:12px;line-height:1.7;color:#9ca4b5;font-weight:400}
.form-section-title{font-size:12px;font-weight:650;letter-spacing:1px;color:#a1a9b9;text-transform:uppercase;margin:5px 0 17px}
.field-row{display:flex;gap:10px;align-items:end}
.field-row .field{flex:1}
.input-prefix{position:relative}
.input-prefix input{padding-right:35px}
.input-prefix>span{position:absolute;right:12px;top:11px;color:#a1aabc;font-size:13px}
.settings-actions{display:flex;justify-content:flex-end;padding-top:22px}
.integration-list{padding:0 24px 16px}
.integration-row{display:flex;align-items:center;gap:12px;padding:16px 0;border-top:1px solid #f0f2f6}
.integration-row:first-child{border:0}
.integration-row .integration-icon{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;color:#94a2b1}
.integration-row>div:nth-child(2){flex:1}
.integration-row strong{font-size:13px;display:block}
.integration-row p{font-size:12px;color:#a1a9b8;margin-top:5px}
.integration-row .badge{font-size:12px}
.danger-zone{margin-top:24px;padding:22px;background:white;border:1px solid #f0e5e5;border-radius:var(--radius)}
.danger-zone h3{font-size:12px}
.danger-zone p{font-size:13px;color:var(--muted);line-height:1.8;margin:9px 0 15px}

dialog{padding:0;color:var(--ink);border:0;box-shadow:0 20px 90px #13244733;background:white;max-height:calc(100dvh - 48px);overflow:hidden}
dialog::backdrop{background:#15234055;backdrop-filter:blur(3px)}
dialog.drawer{margin:0 0 0 auto;width:490px;max-width:100%;height:100dvh;max-height:100dvh;border-radius:15px 0 0 15px}
dialog.modal{width:720px;max-width:calc(100% - 32px);border-radius:16px}
dialog.wide{width:920px}
dialog.small-modal{width:470px}
dialog[open]{animation:dialog-in .2s ease-out}
dialog.drawer[open]{animation:drawer-in .24s ease-out}
.dialog-shell{display:flex;flex-direction:column;height:100%;max-height:inherit}
.dialog-header{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:23px 25px;border-bottom:1px solid var(--line);flex-shrink:0}
.dialog-header h2{font-size:19px;font-weight:600;letter-spacing:-.6px}
.dialog-header p{font-size:13px;color:#98a1b2;margin-top:7px}
.dialog-content{padding:24px 25px;overflow-y:auto;flex:1;overscroll-behavior:contain}
.dialog-content .field{margin-bottom:20px}
.dialog-content .form-grid .field{margin-bottom:0}
.dialog-content .form-grid{margin-bottom:20px;gap:16px}
.dialog-footer{padding:17px 25px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#fff;flex-shrink:0}
.dialog-footer .button{min-height:39px}
.dialog-footer .footer-left{margin-right:auto}
.dialog-note{font-size:12px;color:#98a3b6;line-height:1.8;margin-top:16px}
.dialog-error{background:#fff1ee;color:#a6584d;border:1px solid #f4dad4;border-radius:8px;padding:12px;line-height:1.7;font-size:13px;margin-bottom:15px}
.customer-preview{display:flex;align-items:center;gap:12px;padding:16px;background:#f8f9fc;border:1px solid var(--line);border-radius:10px;margin-bottom:24px}
.customer-preview strong{font-size:12px;display:block}
.customer-preview small{font-size:12px;display:block;margin-top:5px}
.customer-preview .badge{margin-left:auto}
.date-summary{background:#f7f8ff;border:1px solid #e9ebfc;border-radius:10px;padding:16px;margin:0 0 20px}
.date-summary>span{display:block;font-size:12px;color:#8992b3;margin-bottom:12px}
.date-flow{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#616cd0}
.date-flow strong{font-size:14px;font-weight:550}
.date-summary small{display:block;font-size:12px;line-height:1.7;margin-top:12px;color:#99a2bd}
.amount-breakdown{padding:17px;border:1px solid var(--line);border-radius:9px;background:#fdfdff}
.stat-line{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;padding:6px 0}
.stat-line>span{color:#8a95aa}
.stat-line strong{font-weight:550}
.amount-breakdown .divider{margin:10px 0}
.details-toggle{border:1px solid var(--line);border-radius:8px;margin-bottom:21px}
.details-toggle summary{font-size:13px;cursor:pointer;padding:13px 15px;color:#7f899f}
.details-toggle>div{padding:4px 15px 15px}
.details-toggle .field{margin-bottom:0}
.new-customer-section{padding:16px;background:#fafaff;border:1px solid #e7e9f8;border-radius:10px;margin-bottom:22px}
.new-customer-section .field:last-child{margin-bottom:0}
.field-label-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;font-weight:550;color:#65718a}
.customer-select-box{margin-bottom:21px}
.customer-select-box select{width:100%;height:40px;border:1px solid #e0e5ef;border-radius:7px;padding:8px;font-size:13px;color:#647189}
.checkbox-field{display:flex;align-items:flex-start;gap:9px;font-size:12px;line-height:1.7;color:#7e8aa2}
.checkbox-field input{accent-color:var(--accent);margin-top:3px}
.detail-product{display:flex;align-items:center;gap:12px;margin:23px 0}
.detail-product h3{font-size:16px}
.detail-product p{font-size:13px;color:#8e99ab;margin-top:6px}
.detail-dates{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;margin-bottom:20px;overflow:hidden}
.detail-dates>div{padding:15px}
.detail-dates>div+div{border-left:1px solid var(--line)}
.detail-dates span{display:block;font-size:12px;color:#929caf;margin-bottom:8px}
.detail-dates strong{font-size:12px}
.detail-status{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin:18px 0}
.detail-status>span{color:#8e99ae}
.help-list{display:grid;gap:22px}
.help-item{display:flex;gap:12px}
.help-item>span{width:28px;min-width:28px;height:28px;border-radius:8px;background:var(--accent-soft);display:grid;place-items:center;font-size:13px;color:#6973cf}
.help-item h3{font-size:12px;margin-bottom:6px}
.help-item p{font-size:13px;line-height:1.8;color:#8894a9}

.command-dialog{width:640px;max-width:calc(100% - 30px);border-radius:15px;margin-top:15vh}
.command-input{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);color:#a1a9bc}
.command-input input{flex:1;border:0;font-size:13px;outline:none;background:transparent;color:var(--ink)}
.command-input input:focus{box-shadow:none}
.command-input kbd{font:inherit;font-size:12px;color:#a1a9b8;padding:4px 5px;border:1px solid var(--line);border-radius:4px}
.command-results{padding:12px;max-height:440px;overflow:auto}
.command-label{font-size:12px;color:#a2aaba;letter-spacing:1px;padding:9px 10px}
.command-result{display:flex;align-items:center;gap:12px;padding:12px;width:100%;background:none;border:0;border-radius:8px;text-align:left}
.command-result:hover,.command-result:focus{background:#f3f4fd}
.command-result>div{flex:1}
.command-result strong{font-size:12px;display:block;font-weight:550}
.command-result small{font-size:12px;display:block;margin-top:5px}
.command-result>.icon{color:#a1abc0}
.command-foot{border-top:1px solid var(--line);padding:12px 20px;font-size:12px;color:#9da6b7}

.campaign-steps{display:flex;justify-content:center;padding:19px 25px;gap:28px;border-bottom:1px solid var(--line);background:#fcfcfe}
.campaign-step{display:flex;align-items:center;gap:7px;font-size:12px;color:#a2aabb}
.campaign-step>span{height:22px;width:22px;display:grid;place-items:center;border-radius:50%;background:#eff1f7;font-size:12px}
.campaign-step.active{color:#636ed0;font-weight:550}
.campaign-step.active>span{background:var(--accent);color:white}
.campaign-step.done>span{background:#eaf5ef;color:#659477}
.campaign-builder{display:grid;grid-template-columns:1fr 1fr;gap:27px;min-height:305px}
.campaign-builder.single{display:block}
.audience-box{border:1px solid var(--line);padding:20px;border-radius:11px;align-self:start}
.audience-box>span{font-size:12px;color:#959fb2}
.audience-number{font-size:43px;letter-spacing:-1.6px;font-weight:550;color:#5864c5;margin:11px 0 8px}
.audience-number small{font-size:12px;letter-spacing:0;margin-left:6px}
.audience-box .divider{margin:16px 0}
.audience-box .stat-line{font-size:12px}
.audience-box p{font-size:12px;line-height:1.8;color:#95a0b4;margin-top:14px}
.email-preview{background:#f5f6fb;border:1px solid var(--line);border-radius:11px;padding:18px;align-self:start}
.preview-label{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.8px;color:#9ba4b7;margin-bottom:17px}
.email-card{background:white;border:1px solid #e7eaf2;border-radius:9px;overflow:hidden;box-shadow:0 4px 10px #21315204}
.email-card-header{padding:17px;border-bottom:1px solid var(--line)}
.email-card-header>strong{font-size:13px;display:block;line-height:1.8}
.email-card-header small{font-size:12px;line-height:1.7;display:block;margin-top:7px}
.email-body{padding:20px 17px;white-space:pre-line;font-size:13px;color:#818da4;line-height:1.9;overflow-wrap:anywhere}
.email-footer{padding:12px 17px;font-size:12px;line-height:1.8;color:#a4adbd;background:#fbfcff;border-top:1px solid var(--line)}
.email-footer u{color:#919dc1}
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:23px}
.review-recipient-list{max-height:145px;overflow:auto;margin-top:12px;border-top:1px solid var(--line)}
.review-recipient{font-size:12px;display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f1f3f8}
.review-recipient span:last-child{color:#96a1b4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.review-card{border:1px solid var(--line);border-radius:10px;padding:18px}
.review-card h3{font-size:12px;margin-bottom:10px}

.toast-stack{position:fixed;bottom:24px;right:24px;z-index:10000;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:#fff;border:1px solid #dfe8e4;border-radius:12px;box-shadow:0 10px 40px #1527401a;padding:15px 17px;min-width:285px;max-width:440px;display:flex;align-items:flex-start;gap:11px;animation:toast-in .25s ease-out;pointer-events:auto}
.toast>.icon{color:#70a387;margin-top:1px}
.toast strong{font-size:12px;font-weight:550;display:block}
.toast p{font-size:12px;line-height:1.7;color:#96a0b3;margin-top:5px}
.toast.error>.icon{color:#bf806e}
.toast.error{border-color:#eedcd6}

@keyframes drawer-in{from{transform:translateX(35px);opacity:.6}
to{transform:translateX(0);opacity:1}
}
@keyframes dialog-in{from{transform:translateY(10px);opacity:.6}
to{transform:translateY(0);opacity:1}
}
@keyframes toast-in{from{transform:translateY(8px);opacity:0}
to{transform:translateY(0);opacity:1}
}


/* Tooldesk 0.2 - single-system responsive interface.
   1024+ px: tables; <1024 px: semantic record cards and bottom navigation.
   Controls never depend on hover alone. Phone input text stays >=16px. */
:root {
  --sidebar: 236px; --ink: #202b45; --muted: #64748b; --line: #e7ebf3;
  --accent: #555fdb; --accent-dark: #434cc6; --red: #ad3e4b;
  --green: #166b52; --amber: #8e621a; --radius: 16px;
}
html { scroll-padding-top: 88px; }
body { line-height: 1.5; }
button, a, input, select, textarea { touch-action: manipulation; }
:focus-visible { outline: 3px solid #8d98ee; outline-offset: 3px; }
[hidden] { display: none !important; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.icon { display: inline-block; flex: 0 0 auto; overflow: visible; }
.sidebar { padding: 28px 16px 18px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.brand { padding: 0 12px; margin: 0 0 14px; min-height: 40px; }
.brand-name { display: inline-flex; align-items:baseline; }
.brand-name>span { color:#929db2; }
.sidebar-caption { color:#6e7c96; font-size:10px; font-weight:600; letter-spacing:.7px; padding:0 12px; margin-bottom:32px; }
.nav-label { font-size:10px; color:#7c879a; margin-bottom:9px; }
.nav-group { gap:5px; margin-bottom:28px; }
.nav-item { min-height:44px; font-size:13px; padding:11px 12px; color:#596780; }
.nav-item .icon { height:20px; width:20px; opacity:1; }
.nav-count { font-size:11px; }
.sidebar-bottom { padding-top:24px; }
.sidebar-user { min-width:0; gap:10px; }
.sidebar-user>span { min-width:0; }
.sidebar-user strong, .sidebar-user small { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sidebar-user small { font-size:11px; }
.sidebar-user>.icon { width:18px; height:18px; margin-left:auto; }
.sidebar-close, .mobile-dock, .mobile-records { display:none; }
.topbar { height:68px; position:sticky; top:0; z-index:25; backdrop-filter:blur(16px); padding:0 32px; }
.breadcrumb { font-size:13px; min-width:0; gap:12px; }
.breadcrumb>span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.topbar-actions { gap:12px; flex-shrink:0; }
.global-search { min-height:40px; font-size:12px; color:#6c7891; min-width:225px; }
.demo-pill { font-size:10px; letter-spacing:.4px; color:#7c718f; }
.icon-button { width:38px; min-width:38px; height:38px; min-height:38px; color:#67758c; border-radius:9px; }
main { padding:32px 32px 22px; max-width:1720px; min-height:calc(100dvh - 68px); }
main:focus { outline:none; }
.page-heading { margin-bottom:26px; gap:20px; }
.page-heading>div:first-child { min-width:0; }
.page-heading h1 { font-size:30px; line-height:1.3; letter-spacing:-.8px; }
.page-heading p { font-size:13px; color:var(--muted); line-height:1.7; }
.page-actions { flex-wrap:wrap; justify-content:flex-end; gap:10px; }
.button { min-height:40px; padding:10px 15px; font-size:13px; line-height:1.4; border-radius:9px; justify-content:center; }
.button.small { min-height:36px; padding:8px 11px; font-size:12px; }
.text-button { min-height:36px; font-size:12px; gap:6px; flex-shrink:0; }
.text-link { overflow-wrap:anywhere; }
.text-link.strong { font-size:13px; line-height:1.5; }
.metrics-grid { gap:16px; margin-bottom:24px; }
.metric-card { padding:20px; border-radius:16px; }
.metric-top { font-size:12px; color:#65738c; gap:6px; }
.metric-top>span:first-child { min-width:0; }
.metric-icon { width:30px; height:30px; flex:0 0 auto; }
.metric-value { font-size:clamp(23px,2.05vw,34px); margin:16px 0 12px; letter-spacing:-.8px; overflow-wrap:anywhere; }
.metric-value .unit { font-size:.52em; margin-left:3px; }
.metric-foot { font-size:11px; color:#6f7e96; line-height:1.65; min-height:18px; }
.dashboard-work, .dashboard-bottom { grid-template-columns:minmax(0,1fr) 290px; gap:22px; }
.section-heading { padding:22px 22px 16px; gap:12px; }
.section-heading>div { min-width:0; }
.section-heading h2 { font-size:16px; line-height:1.5; flex-wrap:wrap; }
.section-heading p { font-size:12px; line-height:1.7; color:var(--muted); }
.count-bubble { font-size:11px; }
.tabs { padding:0 22px; gap:24px; scroll-padding-inline:22px; overscroll-behavior-x:contain; }
.tab { min-height:48px; padding:12px 0; font-size:13px; color:#64748b; flex-shrink:0; }
.tab span { font-size:11px; color:#66758d; }
.table-scroll { max-width:100%; }
table { width:100%; min-width:0; font-size:13px; }
th { font-size:11px; color:#65748e; padding:13px 14px; letter-spacing:.1px; }
td { font-size:13px; color:#53637c; padding:17px 14px; }
th:first-child, td:first-child { padding-left:22px; }
th:last-child, td:last-child { padding-right:22px; }

// ----- src/domain.js -----
/** Pure business helpers. Dates are YYYY-MM-DD in the shop's calendar.
 * expiresAt is EXCLUSIVE: a package expiring 2026-10-06 is expired at
 * 00:00 Asia/Ho_Chi_Minh on that date. Production must enforce this server-side.

function parseDay(iso) {

  if (!Number.isFinite(date.getTime()) || date.toISOString().slice(0, 10) !== iso) throw new Error('Ngày không hợp lệ.');

function addDays(iso, days) {

  if (unit !== 'months') throw new Error('Đơn vị thời hạn không hợp lệ.');

    throw new Error('Số tiền phải là số nguyên không âm, tính bằng đồng.');
  if (amount === 0 && costRecovered === 0) throw new Error('Cần có khoản hoàn tiền hoặc giá vốn thực tế thu hồi.');
  if (amount > f.remainingRefund) throw new Error(`Chỉ còn có thể hoàn ${money(f.remainingRefund)} cho đơn này.`);
  if (costRecovered > f.remainingCost) throw new Error(`Giá vốn còn có thể thu hồi là ${money(f.remainingCost)}.`);
  if (amount === 0 && f.refunded === 0) throw new Error('Chỉ ghi nhận thu hồi giá vốn riêng sau khi đơn đã có hoàn tiền.');

  if (!['keep', 'end'].includes(action)) throw new Error('Cách xử lý gói không hợp lệ.');
  if (action === 'end') {
    if (amount !== f.remainingRefund || amount === 0) throw new Error('Chỉ kết thúc kỳ khi hoàn hết số tiền còn lại.');
    if (!refundServiceOption(data, order).allowed) throw new Error('Gói đã thay đổi. Vui lòng giữ nguyên gói và kiểm tra lại lịch sử.');
  }
  const record = {
    id: uid('ht'), operationId: input.operationId || uid('op'), orderId: order.id,
    amount, costRecovered, date, reason, method: input.method,
    reference: String(input.reference || '').trim().slice(0, 120),
    serviceAction: action, actor: input.actor || data.settings?.ownerName || 'Người quản lý',
    createdAt: new Date().toISOString(), kind: amount > 0 ? 'refund' : 'cost_recovery'

}
function customerStats(data, customerId) {
  const orders = data.orders.filter(o => o.customerId === customerId && o.status !== 'cancelled');
  const subscriptions = data.subscriptions.filter(s => s.customerId === customerId);
  return { orders, subscriptions, spend: totalPaid(orders, data.refunds || []), active: subscriptions.filter(s => isActive(s)).length };
}
function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((email || '').trim());
}
/** Snapshot candidates first; revalidate permission at send-time in production. */
function audienceFor(data, segment = 'all') {
  const selected = data.customers.filter(c => {
    const stats = customerStats(data, c.id);
    if (segment === 'active') return stats.active > 0;
    if (segment === 'expiring') return stats.subscriptions.some(s => subStatus(s, DEMO_TODAY, data.settings.reminderDays) === 'expiring');
    if (segment === 'expired') return stats.active === 0 && stats.subscriptions.some(s => subStatus(s) === 'expired');
    if (segment === 'vip') return stats.spend >= 2000000;
    return true;
  });
  const unique = new Set();
  const excluded = { noConsent: 0, invalidEmail: 0, duplicate: 0 };
  const eligible = selected.filter(c => {
    if (c.emailConsent !== 'opted_in') { excluded.noConsent++; return false; }
    if (!isValidEmail(c.email)) { excluded.invalidEmail++; return false; }
    const email = c.email.trim().toLowerCase();
    if (unique.has(email)) { excluded.duplicate++; return false; }
    unique.add(email);
    return true;
  });
  return { selected, eligible, excluded, excludedCount: selected.length - eligible.length };
}
function findCustomer(data, id) { return data.customers.find(c => c.id === id); }
function findProduct(data, id) { return data.products.find(p => p.id === id); }
function findPlan(data, id) { return data.products.flatMap(p => p.plans).find(p => p.id === id); }
function searchRows(rows, query, project) {
  const tokens = normalize(query).split(/\s+/).filter(Boolean);
  return rows.filter(row => tokens.every(token => normalize(project(row)).includes(token)));
}
function pageRows(rows, page, size = PAGE_SIZE) {
  const pages = Math.max(1, Math.ceil(rows.length / size));
  const current = Math.max(1, Math.min(page, pages));
  return { rows: rows.slice((current - 1) * size, current * size), total: rows.length, page: current, pages, size };
}

/** Upgrade existing v1 browser data in place without losing customer edits.
 * paidAtEstimated marks legacy receipts whose actual payment date was not stored.

function migrateData(data) {
  data.refunds ||= [];
  data.schemaVersion = 2;
  for (const order of data.orders) {
    if (order.payment === 'paid' && !order.paidAt) {
      order.paidAt = order.date;
      order.paidAtEstimated = true;
    }
  }
  return data;
}

  const initials = (customer?.name || '?').split(/\s+/).slice(-2).map(s=>s[0]).join('');
  return `<span class="avatar ${esc(customer?.color || 'lavender')} ${size}" aria-hidden="true">${esc(initials)}</span>`;
}
function productLogo(product, size='') {
  return `<span class="product-logo ${esc(product?.color || 'mint')} ${size}" aria-hidden="true">${esc(product?.symbol || '✦')}</span>`;
}
function customerCell(customer, secondary) {
  return `<div class="person-cell">${avatar(customer)}<div><button class="text-link strong" data-action="customer" data-id="${esc(customer?.id)}">${esc(customer?.name || 'Khách đã xóa')}</button><small>${esc(secondary ?? customer?.email ?? '')}</small></div></div>`;
}
function productCell(product, plan) {
  return `<div class="product-cell">${productLogo(product)}<div><span class="strong">${esc(product?.name || 'Sản phẩm')}</span><small>${esc(plan?.name || '')}</small></div></div>`;
}
function badge(text, tone='neutral', dot=true) {
  return `<span class="badge ${tone}">${dot ? '<i></i>' : ''}${esc(text)}</span>`;
}
function paymentBadge(orderOrPayment, refunds = []) {
  const status = typeof orderOrPayment === 'string' ? orderOrPayment : orderFinancials(orderOrPayment, refunds).status;
  const labels = {paid:['Đã thanh toán','green'], unpaid:['Chưa thanh toán','amber'],
    partially_refunded:['Hoàn một phần','amber'], refunded:['Đã hoàn toàn bộ','red']};
  const [label,tone] = labels[status] || labels.unpaid;
  return badge(label,tone);
}
function subscriptionBadge(sub, window=7) {
  const type=subStatus(sub, undefined, window);
  return badge(({active:'Đang hoạt động',expiring:'Sắp hết hạn',expired:'Đã hết hạn',cancelled:'Đã dừng',scheduled:'Chưa bắt đầu'})[type], ({active:'green',expiring:'amber',expired:'red',cancelled:'neutral',scheduled:'blue'})[type]);
}
function field(label, content, hint='') {
  return `<label class="field"><span>${label}</span>${content}${hint?`<small>${hint}</small>`:''}</label>`;
}
function emptyState(title='Không tìm thấy kết quả', description='Thử thay đổi bộ lọc hoặc từ khóa tìm kiếm.', action='') {
  return `<div class="empty-state"><div class="empty-icon">${icon('inbox',28)}</div><h3>${esc(title)}</h3><p>${esc(description)}</p>${action}</div>`;
}
function pageHeader(title, subtitle, actions='') {
  return `<div class="page-heading"><div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div><div class="page-actions">${actions}</div></div>`;
}
function searchInput(value='', placeholder='Tìm kiếm...', id='list-search') {
  return `<label class="search-field">${icon('search',18)}<input id="${id}" data-filter="search" value="${esc(value)}" placeholder="${esc(placeholder)}" aria-label="${esc(placeholder)}" autocomplete="off">${value?'<button type="button" class="search-clear" data-action="clear-search" aria-label="Xóa tìm kiếm">×</button>':''}</label>`;
}
function pagination(paged) {
  const start=paged.total ? (paged.page-1)*paged.size+1 : 0, end=Math.min(paged.page*paged.size,paged.total);
  return `<div class="table-footer"><span>Hiển thị <strong>${start}–${end}</strong> trong ${paged.total} kết quả</span><div class="pagination"><button class="icon-button" data-action="page" data-page="${paged.page-1}" ${paged.page===1?'disabled':''} aria-label="Trang trước">${icon('left',17)}</button><span>Trang ${paged.page} / ${paged.pages}</span><button class="icon-button" data-action="page" data-page="${paged.page+1}" ${paged.page===paged.pages?'disabled':''} aria-label="Trang sau">${icon('chevron',17)}</button></div></div>`;
}
function tabs(items, active, filter='tab') {
  return `<div class="tabs" role="group" aria-label="Lọc danh sách">${items.map(([id,label,count])=>`<button class="tab ${active===id?'selected':''}" data-action="tab" data-filter="${filter}" data-value="${id}" aria-pressed="${active===id}">${esc(label)}${count!==undefined?`<span>${count}</span>`:''}</button>`).join('')}</div>`;
}
function productOptions(data, selected='') {
  return `<option value="">Tất cả sản phẩm</option>${data.products.map(p=>`<option value="${p.id}" ${selected===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}`;
}
function tableActions(primary, detailAction, id) {
  return `<div class="row-actions">${primary}<button class="icon-button" data-action="${detailAction}" data-id="${esc(id)}" aria-label="Xem chi tiết">${icon('more',18)}</button></div>`;
}
function activityList(data, count=4) {
  const icons={payment:'wallet',renewal:'refresh',reminder:'mail',created:'plus',campaign:'megaphone',updated:'edit',refund:'refund',cost_recovery:'wallet'};
  return `<div class="activity-list">${data.activity.slice(0,count).map((a,i)=>`<div class="activity-row"><span class="activity-symbol ${i===0?'highlight':''}">${icon(icons[a.type]||'check',16)}</span><div><strong>${esc(a.title)}</strong><p>${esc(a.description)}</p><small>${esc(a.at ? new Intl.DateTimeFormat('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',timeZone:'Asia/Ho_Chi_Minh'}).format(new Date(a.at)) : 'Vừa xong')}</small></div></div>`).join('')}</div>`;
}
function metricCard(label, value, symbol, foot, accent='', extra='') {
  return `<article class="metric-card ${accent}"><div class="metric-top"><span>${esc(label)}</span><span class="metric-icon">${icon(symbol,19)}</span></div><div class="metric-value">${value}</div><div class="metric-foot">${extra}${foot}</div></article>`;
}
function hintBanner(text, tone='blue', symbol='info') {
  return `<div class="hint-banner ${tone}">${icon(symbol,18)}<span>${text}</span></div>`;
}
function sectionHeader(title, subtitle='', action='') {
  return `<div class="section-heading"><div><h2>${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div>${action}</div>`;
}
function statLine(label, value) {return `<div class="stat-line"><span>${label}</span><strong>${value}</strong></div>`;}
function amountBreakdown(price,cost) {return `<div class="amount-breakdown">${statLine('Giá bán',money(price))}${statLine('Giá vốn',money(cost))}<div class="divider"></div>${statLine('Lợi nhuận gộp',`<span class="${price-cost<0?'negative':'positive'}">${money(price-cost)}</span>`)}</div>`;}

const primaryOrder = `<button class="button primary" data-action="new-order">${icon('plus',16)}Tạo đơn hàng</button>`;
const currencyValue = value => `${money(value).replace(' ₫','')}<span class="unit">₫</span>`;
const goButton = (route,label) => `<button class="text-button" data-action="go" data-route="${route}">${label}${icon('arrow',14)}</button>`;
const fFor = state => state.filters[state.route] || {search:'',tab:'all',product:'',page:1};

function revenueChart(data, days = 7) {
  const start = addDays(DEMO_TODAY, -(days-1));
  const series=Array.from({length:days},(_,i)=> {
    const day=addDays(start,i);
    return {day,value:cashSummary(data,day,day).revenue};
  });
  const width=700,height=195,left=52,right=18,top=20,bottom=31;
  const max=Math.max(1000000,...series.map(s=>s.value))*1.15;
  const min=Math.min(0,...series.map(s=>s.value))*1.15;
  const range=max-min;
  const points=series.map((s,i)=>({x:left+i*(width-left-right)/(days-1),y:top+(height-top-bottom)*(max-s.value)/range}));
  let path=`M${points[0].x},${points[0].y}`;
  for (let i=1;i<points.length;i++) {
    const prev=points[i-1],p=points[i],mx=(prev.x+p.x)/2;
    path+=` C${mx},${prev.y} ${mx},${p.y} ${p.x},${p.y}`;
  }
  const floor=top+(height-top-bottom)*max/range;
  const grid=[0,.333,.666,1].map(frac=>{
    const y=top+(height-top-bottom)*frac;
    const label=Math.round((max-range*frac)/100000)/10;
    return `<line x1="${left}" y1="${y}" x2="${width-right}" y2="${y}" stroke="#edf0f6" stroke-dasharray="3 4"/><text x="${left-12}" y="${y+4}" text-anchor="end">${label ? label.toLocaleString('vi-VN')+' tr':'0'}</text>`;
  }).join('');
  const every=days===7?1:5;
  return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Biểu đồ doanh thu đã thu trong ${days} ngày, từ ${dateLabel(start,true)} đến ${dateLabel(DEMO_TODAY,true)}">
    <defs><linearGradient id="revenue-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9ca5ef" stop-opacity=".25"/><stop offset="100%" stop-color="#9ca5ef" stop-opacity=".01"/></linearGradient></defs>
    ${grid}<path d="${path} L${points.at(-1).x},${floor} L${left},${floor} Z" fill="url(#revenue-fill)"/><path d="${path}" stroke="#939deb" stroke-width="2.5" fill="none"/>
    ${series.map((s,i)=>`${i%every===0||i===days-1?`<text x="${points[i].x}" y="${height-8}" text-anchor="middle">${dateLabel(s.day)}</text>`:''}<circle cx="${points[i].x}" cy="${points[i].y}" r="${days===7?3:2}" fill="white" stroke="#939deb" stroke-width="1.5"><title>${dateLabel(s.day,true)}: ${money(s.value)}</title></circle>`).join('')}
  </svg>`;
}

function dashboardPage(data,state) {
  const current=totals(data),window=data.settings.reminderDays;

  const expired=data.subscriptions.filter(s=>subStatus(s)==='expired').sort((a,b)=>b.expiresAt.localeCompare(a.expiresAt));
  const unpaid=data.orders.filter(o=>o.payment==='unpaid'&&o.status!=='cancelled').sort((a,b)=>b.date.localeCompare(a.date));
  const active=data.subscriptions.filter(s=>isActive(s)).length;
  const taskCount=expiring.length+expired.length+unpaid.length;
  const tab=state.dashboardTab;
  let rows='';
  if(tab==='unpaid'){
    rows=unpaid.slice(0,5).map(o=>`<tr><td>${customerCell(findCustomer(data,o.customerId),o.id)}</td><td>${productCell(findProduct(data,o.productId),findPlan(data,o.planId))}</td><td><div class="remaining warning">${money(o.price)}<small>Chưa thanh toán</small></div></td><td>${tableActions(`<button class="button small renew-button" data-action="order-detail" data-id="${o.id}">Thu tiền</button>`,'order-detail',o.id)}</td></tr>`).join('');
  } else {
    const items=tab==='expired'?expired:expiring;
    rows=items.slice(0,5).map(s=>`<tr><td>${customerCell(findCustomer(data,s.customerId),s.remindedAt?'Đã ghi nhận liên hệ':'Chưa liên hệ')}</td><td>${productCell(findProduct(data,s.productId),findPlan(data,s.planId))}</td><td><div class="remaining ${tab==='expired'?'danger':'warning'}">${remainingLabel(s)}<small>${dateLabel(s.expiresAt,true)}</small></div></td><td>${tableActions(`<button class="button small renew-button" data-action="renew" data-id="${s.id}">${icon('refresh',13)}Gia hạn</button>`,'sub-detail',s.id)}</td></tr>`).join('');
  }
  const potential=expiring.reduce((sum,s)=>sum+s.price,0),contacted=expiring.filter(s=>s.remindedAt).length;
  const days=state.chartDays,totalChart=cashSummary(data,addDays(DEMO_TODAY,-(days-1)),DEMO_TODAY).revenue;
  return `${pageHeader('Tổng quan','Thứ Ba, 06 tháng 10, 2026 · Mọi việc quan trọng, trong một góc nhìn.',`<span class="button date-chip">${icon('calendar',15)}Tháng 10, 2026</span>${primaryOrder}`)}
  <section class="metrics-grid" aria-label="Chỉ số kinh doanh">
    ${metricCard('Thực thu tháng',currencyValue(current.revenue),'wallet',current.refunded?'Đã trừ '+money(current.refunded)+' hoàn tiền':'Từ '+current.paidOrders+' đơn đã thanh toán','accent')}
    ${metricCard('Lợi nhuận gộp',currencyValue(current.gross),'trend','Đã tính hoàn tiền · Chưa trừ chi phí khác')}
    ${metricCard('Gói đang hoạt động',active+'<span class="unit">gói</span>','layers',`Trên tổng ${data.subscriptions.length} gói dịch vụ`)}
    ${metricCard('Cần gia hạn',expiring.length+'<span class="unit">gói</span>','clock',`Trong ${window} ngày tới · ${expired.length} đã hết hạn`,'','<i class="dot"></i>')}
  </section>
  <section class="dashboard-work">
    <article class="panel">
      ${sectionHeader(`Cần xử lý <span class="count-bubble">${taskCount}</span>`,'Một chút chăm sóc hôm nay. Thêm một khách hàng gắn bó.',`<button class="text-button" data-action="view-tasks">Xem tất cả ${icon('arrow',14)}</button>`)}
      ${tabs([['renewal','Sắp hết hạn',expiring.length],['expired','Đã hết hạn',expired.length],['unpaid','Chờ thanh toán',unpaid.length]],tab,'dashboardTab')}
      ${rows?`<div class="table-scroll"><table class="work-table"><thead><tr><th>Khách hàng</th><th>Gói dịch vụ</th><th>${tab==='unpaid'?'Cần thu':'Thời hạn'}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:emptyState('Mọi việc đã được xử lý','Không có mục nào cần xử lý trong nhóm này.')}
      <div class="work-footer"><span>${icon('info',12)}${tab==='unpaid'?'Chỉ ghi nhận khi bạn đã nhận được tiền.':'Mốc hết hạn: 00:00 ngày hiển thị, giờ Việt Nam.'}</span><button class="text-button" data-action="view-tasks">${tab==='unpaid'?'Xem đơn hàng':'Mở danh sách'}${icon('arrow',12)}</button></div>

        <div class="opportunity-value">${money(potential,true)}<span style="font-size:15px;color:#c0c9df;margin-left:4px">₫</span></div>

        <div class="opportunity-caption"><span>Đã liên hệ ${contacted}/${expiring.length}</span><span>${expiring.length?Math.round(contacted/expiring.length*100):0}%</span></div>
        <button class="text-button" data-action="open-renewals">Chăm sóc khách ngay ${icon('arrow',14)}</button>
      </div>
      <div class="care-card">
        <div class="care-top"><span class="care-symbol">${icon('mail',18)}</span><h3>Đúng người. Đúng thời điểm.</h3></div>
        <p>Biến danh sách khách hàng thành những kết nối có giá trị.</p>

      <div class="chart-summary"><strong>${money(totalChart)}</strong><small>thực thu sau hoàn</small></div>
      <div class="chart-wrap">${revenueChart(data,days)}</div>
      <div class="chart-legend"><span><i class="legend-dot"></i>Tiền nhận − tiền hoàn, theo ngày giao dịch</span>${goButton('reports','Báo cáo chi tiết')}</div>
    </article>
    <article class="panel">${sectionHeader('Hoạt động gần đây','',`<button class="icon-button" data-action="activity" aria-label="Xem lịch sử hoạt động">${icon('more',18)}</button>`)}${activityList(data,4)}</article>

}

function ordersPage(data,state) {
  const f=fFor(state),allOrders=data.orders.filter(o=>o.status!=='cancelled');

  let items=allOrders.filter(o=>f.tab==='all'||(f.tab==='refunded'?orderFinancials(o,data.refunds).refunded>0:orderFinancials(o,data.refunds).status===f.tab));
  if(f.product)items=items.filter(o=>o.productId===f.product);
  if(f.kind)items=items.filter(o=>o.kind===f.kind);
  items=searchRows(items,f.search,o=>`${o.id} ${findCustomer(data,o.customerId)?.name} ${findCustomer(data,o.customerId)?.email} ${findCustomer(data,o.customerId)?.phone} ${findProduct(data,o.productId)?.name}`);
  items.sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id,undefined,{numeric:true}));
  const paged=pageRows(items,f.page);
  return `${pageHeader('Đơn hàng','Theo dõi giao dịch, thanh toán và hoàn tiền tại một nơi.',primaryOrder)}
    <div class="panel records-panel">
      ${tabs([['all','Tất cả',allOrders.length],['unpaid','Chờ thu',count('unpaid')],['paid','Đã thu',count('paid')],['refunded','Hoàn tiền',refunded]],f.tab)}
      <div class="list-toolbar">${searchInput(f.search,'Tìm mã đơn, tên, SĐT hoặc email...')}
      <select class="select-filter" data-filter="product" aria-label="Lọc sản phẩm">${productOptions(data,f.product)}</select>
      <select class="select-filter" data-filter="kind" aria-label="Loại đơn"><option value="">Tất cả loại đơn</option><option value="new" ${f.kind==='new'?'selected':''}>Mua mới</option><option value="renewal" ${f.kind==='renewal'?'selected':''}>Gia hạn</option></select>
      <button class="button small ghost toolbar-end" data-action="clear-filters">${icon('refresh',13)}Đặt lại bộ lọc</button></div>
      ${paged.rows.length?`<div class="table-scroll desktop-data"><table class="data-table orders-table"><thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Sản phẩm</th><th class="align-right">Giá trị / thực thu</th><th>Thanh toán</th><th class="optional-column">Ngày tạo</th><th><span class="sr-only">Thao tác</span></th></tr></thead><tbody>${paged.rows.map(o=>{
        const financials=orderFinancials(o,data.refunds);

function dialogFrame(title, subtitle, body, footer='', className='drawer', formId='') {
  const wrapper=formId?'form':'div';
  return `<dialog id="active-dialog" class="${className}" aria-labelledby="dialog-title"><${wrapper} class="dialog-shell" ${formId?`id="${formId}"`:''}>
    <header class="dialog-header"><div><h2 id="dialog-title">${esc(title)}</h2>${subtitle?`<p>${esc(subtitle)}</p>`:''}</div><button type="button" class="icon-button" data-action="close-dialog" aria-label="Đóng">${icon('close',19)}</button></header>
    <div class="dialog-content"><div id="form-error" role="alert"></div>${body}</div>
    ${footer?`<footer class="dialog-footer">${footer}</footer>`:''}
  </${wrapper}></dialog>`;
}

function commandResults(data,query=''){
  if(!query.trim()){

  }
  const customers=searchRows(data.customers,query,c=>`${c.name} ${c.id} ${c.email} ${c.phone}`).slice(0,5);
  const orders=searchRows(data.orders,query,o=>`${o.id} ${findCustomer(data,o.customerId)?.name} ${findCustomer(data,o.customerId)?.email} ${findCustomer(data,o.customerId)?.phone} ${findProduct(data,o.productId)?.name}`).slice(0,4);
  return `${customers.length?`<div class="command-label">KHÁCH HÀNG</div>${customers.map(c=>`<button class="command-result" data-action="customer" data-id="${c.id}">${avatar(c)}<div><strong>${esc(c.name)}</strong><small>${esc(c.email||c.phone)} · ${c.id.toUpperCase()}</small></div>${icon('arrow',15)}</button>`).join('')}`:''}
  ${orders.length?`<div class="command-label">ĐƠN HÀNG</div>${orders.map(o=>`<button class="command-result" data-action="order-detail" data-id="${o.id}">${icon('orders',20)}<div><strong>${o.id} · ${esc(findProduct(data,o.productId)?.name)}</strong><small>${esc(findCustomer(data,o.customerId)?.name)} · ${money(o.price)}</small></div>${icon('arrow',15)}</button>`).join('')}`:''}
  ${!customers.length&&!orders.length?emptyState('Chưa tìm thấy kết quả','Thử tên, email, số điện thoại hoặc mã đơn.'):''}`;
}

function syncResponsiveShell(){
  const narrow=window.matchMedia('(max-width: 1023px)').matches;
  const sidebar=document.querySelector('.sidebar');
  const shell=document.querySelector('.shell');
  const dock=document.querySelector('.mobile-dock');
  if(!sidebar||!shell)return;
  sidebar.inert=narrow&&!state.mobileOpen;
  shell.inert=narrow&&state.mobileOpen;
  if(dock)dock.inert=narrow&&state.mobileOpen;
  if(narrow&&state.mobileOpen){
    sidebar.setAttribute('role','dialog');
    sidebar.setAttribute('aria-modal','true');
  }else{sidebar.removeAttribute('role');sidebar.removeAttribute('aria-modal');}
  document.body.style.overflow=(narrow&&state.mobileOpen)||document.getElementById('active-dialog')?'hidden':'';
}
function setMobileMenu(open){
  state.mobileOpen=open;render();
  if(open)document.querySelector('.sidebar .active')?.focus({preventScroll:true});
  else document.querySelector('.mobile-more')?.focus({preventScroll:true});
}
function readRoute(){
  const parts=location.hash.replace(/^#\/?/,'').split('/');
  state.route=Object.hasOwn(routeLabels,parts[0])?parts[0]:'dashboard';
  state.customerId=state.route==='customers'?(parts[1]||''):'';
  state.mobileOpen=false;
}
function navigate(route,id=''){
  if(!closeDialog())return;
  const next=`#/${route}${id?'/'+encodeURIComponent(id):''}`;
  if(location.hash===next){readRoute();render();}else{location.hash=next;}
}
function showDialog(html){
  if(state.mobileOpen){state.mobileOpen=false;render();}
  const existing=document.getElementById('active-dialog');
  if(!existing){
    const el=document.activeElement;
    returnFocus=el?.dataset?.action?{action:el.dataset.action,id:el.dataset.id,route:el.dataset.route}:null;
  }else existing.close();
  const root=document.getElementById('dialog-root');
  root.innerHTML=html;
  const dialog=document.getElementById('active-dialog');
  dialog.showModal();
  document.body.style.overflow='hidden';
  dialog.addEventListener('cancel',event=>{event.preventDefault();closeDialog();});
  dialog.addEventListener('click',event=>{
    if(event.target!==dialog)return;
    const rect=dialog.getBoundingClientRect();
    if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeDialog();
  });
  // Autofocus the first input without scrolling the entire underlying page.
  const field=dialog.querySelector('input:not([type="hidden"]):not([disabled]),select:not([disabled]),textarea');
  if(field&&window.matchMedia('(min-width: 1024px)').matches)field.focus({preventScroll:true});
  else dialog.querySelector('[data-action="close-dialog"]')?.focus({preventScroll:true});
}
function closeDialog(force=false){
  const dialog=document.getElementById('active-dialog');
  if(!dialog)return true;
  if(!force&&dialog.querySelector('form[data-dirty="true"]')){
    if(!window.confirm('Bạn chưa lưu thay đổi. Đóng và bỏ các thay đổi này?'))return false;
  }
  dialog.close();document.getElementById('dialog-root').innerHTML='';document.body.style.overflow='';
  if(returnFocus){
    const selector=`[data-action="${CSS.escape(returnFocus.action)}"]${returnFocus.id?`[data-id="${CSS.escape(returnFocus.id)}"]`:''}${returnFocus.route?`[data-route="${CSS.escape(returnFocus.route)}"]`:''}`;
    document.querySelector(selector)?.focus({preventScroll:true});
  }
  return true;
}
function toast(title,description='',error=false){
  const id=uid('toast'),root=document.getElementById('toast-root');
  while(root.children.length>=2)root.firstElementChild.remove();
  root.insertAdjacentHTML('beforeend',`<div class="toast ${error?'error':''}" id="${id}">${icon(error?'info':'circleCheck',20)}<div><strong>${esc(title)}</strong>${description?`<p>${esc(description)}</p>`:''}</div></div>`);
  setTimeout(()=>document.getElementById(id)?.remove(),5500);
}
function errorMessage(message){
  const target=document.getElementById('form-error');
  if(target){target.innerHTML=`<div class="dialog-error">${esc(message)}</div>`;target.scrollIntoView({block:'nearest'});}
  else toast('Chưa thể thực hiện',message,true);
}
function logActivity(d,type,title,description){
  d.activity.unshift({id:uid('event'),type,title,description,at:new Date().toISOString()});
  d.activity=d.activity.slice(0,100);
}
function commit(mutator,title,description=''){
  const next=structuredClone(data);
  mutator(next);
  data=next;
  const saved=persistData(data);
  render();
  toast(title,description+(saved?'':' Dữ liệu hiện chỉ lưu trong phiên; hãy xuất JSON trước khi đóng.'),!saved);
}
function nextOrderId(d){
  const highest=Math.max(1000,...d.orders.map(o=>Number(o.id.replace(/\D/g,''))||0));
  return `DH-${highest+1}`;
}
function numberValue(form,name){
  const value=Number(form.elements[name].value);
  if(!Number.isSafeInteger(value)||value<0||value>999999999)throw new Error('Giá tiền phải là số nguyên từ 0 đến 999.999.999 đồng.');
  return value;
}
function contactCheck(d,email,phone,excludeId=''){
  const normalizedEmail=email.trim().toLowerCase();
  if(email&&!isValidEmail(email))throw new Error('Email chưa đúng định dạng.');
  if(!email.trim()&&!phone.trim())throw new Error('Cần ít nhất email hoặc số điện thoại để liên hệ.');
  if(normalizedEmail&&d.customers.some(c=>c.id!==excludeId&&c.email.trim().toLowerCase()===normalizedEmail))throw new Error('Email này đã có trong hồ sơ khách hàng. Hãy chọn khách hiện có để tránh tạo trùng.');
}
function updateOrderSummary(form,resetPrices=false){
  const p=findProduct(data,form.elements.productId.value);
  if(!p)return;
  if(resetPrices==='product')form.elements.planId.innerHTML=p.plans.map(pl=>`<option value="${pl.id}">${esc(pl.name)}</option>`).join('');
  const plan=findPlan(data,form.elements.planId.value);
  if(!plan)return;
  if(resetPrices){form.elements.price.value=plan.price;form.elements.cost.value=plan.cost;}
  try{
    const start=form.elements.startsAt.value,end=addDuration(start,plan.duration,plan.unit);
    document.getElementById('order-start-label').textContent=dateLabel(start,true);
    document.getElementById('order-end-label').textContent=dateLabel(end,true);
  }catch{}
  const profit=Number(form.elements.price.value)-Number(form.elements.cost.value);
  const output=document.getElementById('order-profit');
  output.textContent=money(profit);output.className=profit>=0?'positive':'negative';
}
function updateRenewSummary(form,resetPrices=false){
  const s=data.subscriptions.find(s=>s.id===form.elements.subscriptionId.value),pl=findPlan(data,form.elements.planId.value);
  if(!s||!pl)return;
  if(resetPrices){form.elements.price.value=pl.price;form.elements.cost.value=pl.cost;}

  document.getElementById('renew-start-label').textContent=dateLabel(dates.startsAt,true);
  document.getElementById('renew-end-label').textContent=dateLabel(dates.expiresAt,true);

}

function saveOrder(form){
  const p=findProduct(data,form.elements.productId.value),pl=findPlan(data,form.elements.planId.value);
  if(!p||!pl||!p.plans.some(plan=>plan.id===pl.id))throw new Error('Vui lòng chọn một gói hợp lệ.');
  const startsAt=form.elements.startsAt.value,expiresAt=addDuration(startsAt,pl.duration,pl.unit);
  const price=numberValue(form,'price'),cost=numberValue(form,'cost'),payment=form.elements.payment.value;
  let customer,createNew=form.elements.isNewCustomer.value==='1';
  if(createNew){
    const name=form.elements.newCustomerName.value.trim(),email=form.elements.newCustomerEmail.value.trim(),phone=form.elements.newCustomerPhone.value.trim();
    if(!name)throw new Error('Vui lòng nhập tên khách hàng.');
    contactCheck(data,email,phone);
    customer={id:uid('kh'),name,email,phone,emailConsent:'unknown',consentSource:'',source:'Nhập thủ công',notes:'',color:'lavender',joinedAt:DEMO_TODAY};
  } else {
    customer=data.customers.find(c=>customerIdentity(c)===form.elements.customerLookup.value.trim());
    if(!customer)throw new Error('Chọn đúng kết quả có mã khách hàng, hoặc bấm “Thêm khách mới”.');
  }
  const orderId=nextOrderId(data),subId=uid('sub'),note=form.elements.note.value.trim();
  closeDialog(true);
  commit(d=>{
    if(createNew)d.customers.unshift(customer);
    d.subscriptions.unshift({id:subId,customerId:customer.id,productId:p.id,planId:pl.id,startsAt,expiresAt,price,cost,remindedAt:null,cancelled:false,lastOrderId:orderId,note:''});
    d.orders.unshift({id:orderId,customerId:customer.id,productId:p.id,planId:pl.id,subscriptionId:subId,date:DEMO_TODAY,startsAt,expiresAt,price,cost,payment,paidAt:payment==='paid'?DEMO_TODAY:null,status:'completed',kind:'new',note});
    logActivity(d,'created','Đã tạo đơn hàng mới',`${customer.name} · ${orderId}`);
  },'Đã tạo đơn '+orderId,`${p.name} · Hết hạn ${dateLabel(expiresAt,true)}. ${payment==='unpaid'?'Đơn chưa thanh toán.':'Đã ghi nhận thanh toán.'}`);
}
function saveRenewal(form){
  const id=form.elements.subscriptionId.value,s=data.subscriptions.find(s=>s.id===id),pl=findPlan(data,form.elements.planId.value);
  if(!s||!pl||!findProduct(data,s.productId).plans.some(p=>p.id===pl.id))throw new Error('Không tìm thấy gói cần gia hạn.');
  const dates=renewalDates(s,pl),price=numberValue(form,'price'),cost=numberValue(form,'cost'),payment=form.elements.payment.value,orderId=nextOrderId(data),c=findCustomer(data,s.customerId);
  closeDialog(true);
  commit(d=>{
    const sub=d.subscriptions.find(item=>item.id===id);
    const previousSubscription=structuredClone(sub);
    if(sub.cancelled||sub.expiresAt<=DEMO_TODAY)sub.startsAt=dates.startsAt;
    sub.expiresAt=dates.expiresAt;sub.planId=pl.id;sub.price=price;sub.cost=cost;sub.remindedAt=null;sub.cancelled=false;sub.lastOrderId=orderId;
    d.orders.unshift({id:orderId,customerId:s.customerId,productId:s.productId,planId:pl.id,subscriptionId:s.id,date:DEMO_TODAY,startsAt:dates.startsAt,expiresAt:dates.expiresAt,price,cost,payment,paidAt:payment==='paid'?DEMO_TODAY:null,previousSubscription,status:'completed',kind:'renewal',note:''});
    logActivity(d,'renewal','Đã gia hạn dịch vụ',`${c.name} · Hạn mới ${dateLabel(dates.expiresAt,true)}`);
  },'Gia hạn thành công',`Hạn mới ${dateLabel(dates.expiresAt,true)} · Đã tạo ${orderId}.`);
}
function updateRefundSummary(form){
  const order=data.orders.find(o=>o.id===form.elements.orderId.value);
  if(!order)return;
  const amount=Number(form.elements.amount.value)||0,cost=Number(form.elements.costRecovered.value)||0;
  document.getElementById('refund-preview').innerHTML=refundPreview(data,order,amount,cost);
  const dateOutput=document.getElementById('refund-date-label');
  if(dateOutput)dateOutput.textContent=dateLabel(form.elements.date.value,true)+' · ngày/tháng/năm';
  const choice=form.elements.serviceAction;
  const end=choice?.querySelector?.('option[value="end"]');
  if(end){
    const originalAllowed=orderFinancials(order,data.refunds).remainingRefund===amount;
    if(!originalAllowed){choice.value='keep';end.disabled=true;}
    else end.disabled=!refundServiceOptionLocal(order);
  }
}
function refundServiceOptionLocal(order){
  const sub=data.subscriptions.find(s=>s.id===order.subscriptionId);
  return sub&&!sub.cancelled&&sub.lastOrderId===order.id&&(order.kind!=='renewal'||Boolean(order.previousSubscription));
}
function saveRefund(form){
  if(!form.elements.confirmed.checked)throw new Error('Xác nhận giao dịch đã thực tế hoàn tất trước khi ghi nhận.');
  const input=Object.fromEntries(new FormData(form));
  input.actor=data.settings.ownerName;
  // Validate on a clone before closing a dirty form.
  recordRefund(structuredClone(data),input);
  closeDialog(true);
  commit(d=>{
    const result=recordRefund(d,input);
    if(!result.duplicate)logActivity(d,result.record.kind,
      result.record.kind==='refund'?'Đã ghi nhận hoàn tiền':'Đã thu hồi giá vốn',
      `${input.orderId} · ${money(result.record.amount||result.record.costRecovered)} · ${result.record.reason}`);
  },input.mode==='recovery'?'Đã ghi nhận thu hồi giá vốn':'Đã lưu phiếu hoàn tiền',
    'Đã cập nhật thực thu, lợi nhuận và lịch sử đơn. Không thực hiện chuyển tiền.');
  showDialog(orderDetailDialog(data,input.orderId));
}
function saveCustomer(form){
  const values=Object.fromEntries(new FormData(form));
  for(const key of ['name','email','phone','notes','consentSource'])values[key]=values[key].trim();
  if(!values.name)throw new Error('Vui lòng nhập tên khách hàng.');
  const old=findCustomer(data,values.id);
  if(!old||old.email.trim().toLowerCase()!==values.email.toLowerCase())contactCheck(data,values.email,values.phone,values.id);
  else if(!values.email&&!values.phone)throw new Error('Cần ít nhất một thông tin liên hệ.');
  if(values.emailConsent==='opted_in'&&!values.consentSource)throw new Error('Vui lòng ghi nhận nguồn xác nhận đồng ý nhận ưu đãi.');
  const id=values.id||uid('kh');
  closeDialog(true);
  commit(d=>{
    const existing=findCustomer(d,id);
    const updated={...values,id,consentUpdatedAt:DEMO_TODAY};
    if(existing)Object.assign(existing,updated);
    else d.customers.unshift({...updated,joinedAt:DEMO_TODAY,color:'lavender'});
    logActivity(d,'updated',existing?'Đã cập nhật khách hàng':'Đã thêm khách hàng',values.name);
  },old?'Đã cập nhật khách hàng':'Đã thêm khách hàng',values.name);
}
function saveProduct(form){
  const values=Object.fromEntries(new FormData(form));

  if(!values.name.trim()||!values.planName.trim())throw new Error('Nhập tên sản phẩm và tên gói dịch vụ.');
  addDuration(DEMO_TODAY,duration,values.unit);
  const price=numberValue(form,'price'),cost=numberValue(form,'cost');

    d.products.push({id:uid('p'),name:values.name.trim(),category:values.category,description:values.description.trim(),color:'blue',symbol:'✦',plans:[{id:uid('pl'),name:values.planName.trim(),duration,unit:values.unit,price,cost}]});
    logActivity(d,'updated','Đã thêm sản phẩm',values.name.trim());
  },'Đã thêm sản phẩm',values.name.trim());
}
function savePlan(form){
